<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101114">
  <title>Kids TV</title>
  <style>
    :root{
      --bg:#101114;--panel:#191b20;--panel2:#242831;--text:#f5f6f8;
      --muted:#9da3ad;--focus:#fff;--gap:18px;--columns:5;--radius:18px
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
    body{min-height:100vh}
    button{font:inherit}
    .app{max-width:1920px;margin:0 auto;padding:32px 42px 72px}
    .top{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:22px}
    .eyebrow{font-size:13px;letter-spacing:.18em;color:var(--muted);font-weight:700}
    h1{font-size:38px;line-height:1;margin:5px 0 0}
    .status{font-size:14px;color:var(--muted)}
    .profiles{display:flex;gap:12px;overflow-x:auto;padding:4px;margin-bottom:34px}
    .profile{border:0;border-radius:999px;padding:11px 20px;background:var(--panel2);color:var(--text);cursor:pointer;outline:none}
    .profile.active{background:#f3f4f6;color:#101114;font-weight:700}
    .profile:focus-visible{box-shadow:0 0 0 4px rgba(255,255,255,.45);transform:scale(1.04)}
    section{margin-bottom:42px}
    .section-head{display:flex;align-items:baseline;gap:12px;margin-bottom:16px}
    h2{font-size:25px;margin:0}
    .count{font-size:14px;color:var(--muted)}
    .grid{display:grid;grid-template-columns:repeat(var(--columns),minmax(0,1fr));gap:var(--gap)}
    .card{border:0;background:transparent;color:inherit;text-align:left;padding:0;cursor:pointer;outline:none;min-width:0;transition:transform .13s ease}
    .card:focus-visible{transform:scale(1.055);z-index:5}
    .poster{position:relative;aspect-ratio:2/3;border-radius:var(--radius);overflow:hidden;background:linear-gradient(145deg,#313640,#1b1e24);box-shadow:0 8px 20px rgba(0,0,0,.28)}
    .card:focus-visible .poster{box-shadow:0 0 0 5px var(--focus),0 14px 36px rgba(0,0,0,.48)}
    .poster img{width:100%;height:100%;object-fit:cover;display:none}
    .poster img.loaded{display:block}
    .fallback{position:absolute;inset:0;display:grid;place-items:center;font-size:38px;color:rgba(255,255,255,.23)}
    .duration{position:absolute;right:9px;bottom:9px;padding:5px 7px;background:rgba(0,0,0,.74);border-radius:7px;font-size:12px;display:none}
    .title{font-size:16px;font-weight:700;line-height:1.22;margin-top:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .meta{color:var(--muted);font-size:12px;margin-top:4px;min-height:15px}
    .empty,.error{background:var(--panel);padding:28px;border-radius:16px;color:var(--muted)}
    .error{color:#ffd6d6}
    @media(max-width:1100px){.app{padding:26px}:root{--gap:14px}}
  </style>
</head>
<body>
<div class="app">
  <header class="top">
    <div>
      <div class="eyebrow">KIDS TV</div>
      <h1 id="pageTitle">Илюша</h1>
    </div>
    <div id="status" class="status">Загрузка…</div>
  </header>
  <nav id="profiles" class="profiles"></nav>
  <main id="content"></main>
</div>

<template id="cardTpl">
  <button class="card" type="button">
    <div class="poster">
      <img alt="">
      <div class="fallback">▶</div>
      <div class="duration"></div>
    </div>
    <div class="title"></div>
    <div class="meta"></div>
  </button>
</template>

<script>
const SUPABASE_URL='https://cmgdmsqcxrbwxghydmtb.supabase.co';
const SUPABASE_KEY='sb_publishable_kirs2iry4_CS49dulAINqg_WloGAPf0';

const state={children:[],media:[],collections:[],items:[],settings:{},activeProfile:'ilyusha'};

async function api(table, query='select=*'){
  const r=await fetch(`${SUPABASE_URL}/rest/v1/${table}?${query}`,{
    headers:{apikey:SUPABASE_KEY,Accept:'application/json'}
  });
  if(!r.ok) throw new Error(`${table}: ${r.status} ${await r.text()}`);
  return r.json();
}

function setStatus(s){document.getElementById('status').textContent=s}

async function load(){
  setStatus('Загрузка…');
  const [children,media,collections,items,settings]=await Promise.all([
    api('kidstv_children','select=*&enabled=eq.true&order=sort_order.asc'),
    api('kidstv_media','select=*&enabled=eq.true&order=sort_order.asc'),
    api('kidstv_collections','select=*&enabled=eq.true&order=sort_order.asc'),
    api('kidstv_collection_items','select=*&enabled=eq.true&order=sort_order.asc'),
    api('kidstv_settings','select=*')
  ]);
  Object.assign(state,{children,media,collections,items});
  state.settings=Object.fromEntries(settings.map(x=>[x.key,x.value]));

  const app=state.settings.app||{};
  if(!state.children.some(c=>c.slug===state.activeProfile)){
    state.activeProfile=app.default_profile||state.children[0]?.slug||null;
  }

  const cols=Number(state.settings.catalog_ui?.grid?.columns||5);
  document.documentElement.style.setProperty('--columns',Math.max(2,Math.min(8,cols)));
  render();
  setStatus(`${media.length} мультфильмов`);
}

function render(){
  renderProfiles();
  renderCollections();
}

function renderProfiles(){
  const host=document.getElementById('profiles');
  host.innerHTML='';
  for(const child of state.children){
    const b=document.createElement('button');
    b.className='profile'+(child.slug===state.activeProfile?' active':'');
    b.textContent=child.name;
    b.onclick=()=>{state.activeProfile=child.slug;render();requestAnimationFrame(()=>document.querySelector('.card')?.focus())};
    host.appendChild(b);
  }
  document.getElementById('pageTitle').textContent=state.children.find(c=>c.slug===state.activeProfile)?.name||'Kids TV';
}

function renderCollections(){
  const host=document.getElementById('content');
  host.innerHTML='';
  const mediaById=new Map(state.media.map(m=>[m.id,m]));
  const cols=state.collections.filter(c=>!c.display?.profile||c.display.profile===state.activeProfile);
  if(!cols.length){
    host.innerHTML='<div class="empty">Для этого профиля разделы пока не настроены.</div>';
    return;
  }
  for(const col of cols){
    const list=state.items
      .filter(i=>i.collection_id===col.id)
      .sort((a,b)=>Number(a.sort_order)-Number(b.sort_order))
      .map(i=>mediaById.get(i.media_id))
      .filter(Boolean);

    const s=document.createElement('section');
    const head=document.createElement('div');
    head.className='section-head';
    const h=document.createElement('h2'); h.textContent=col.title;
    const count=document.createElement('span');count.className='count';count.textContent=list.length;
    head.append(h,count);
    const grid=document.createElement('div');grid.className='grid';
    list.forEach(m=>grid.appendChild(makeCard(m)));
    s.append(head,grid);host.appendChild(s);
  }
}

function makeCard(m){
  const node=document.getElementById('cardTpl').content.firstElementChild.cloneNode(true);
  node.dataset.mediaId=m.id;
  node.querySelector('.title').textContent=m.title;
  const meta=[];
  if(m.year)meta.push(m.year);
  if(m.kinopub_match_status!=='matched')meta.push('KinoPub: не связан');
  node.querySelector('.meta').textContent=meta.join(' · ');

  const showDuration=state.settings.catalog_ui?.tile?.show_duration!==false;
  if(showDuration&&m.duration_minutes){
    const d=node.querySelector('.duration');
    d.textContent=`${m.duration_minutes} мин`;d.style.display='block';
  }
  if(m.poster_url){
    const img=node.querySelector('img');
    img.src=m.poster_url;img.alt=m.title;img.onload=()=>img.classList.add('loaded');
  }
  node.onclick=()=>{
    if(m.kinopub_match_status!=='matched'||!m.kinopub_id){
      setStatus(`«${m.title}»: ещё не сопоставлен с KinoPub`);
    }else{
      setStatus(`Открываю «${m.title}»…`);
      window.dispatchEvent(new CustomEvent('kidstv:play',{detail:m}));
    }
  };
  return node;
}

function visibleCards(){return [...document.querySelectorAll('.card')].filter(e=>e.offsetParent!==null)}

function moveFocus(key){
  const current=document.activeElement;
  if(current.classList.contains('card')){
    const cards=visibleCards(),i=cards.indexOf(current);
    const cols=Number(getComputedStyle(document.documentElement).getPropertyValue('--columns'))||5;
    let n=i;
    if(key==='ArrowRight')n=Math.min(cards.length-1,i+1);
    if(key==='ArrowLeft')n=Math.max(0,i-1);
    if(key==='ArrowDown')n=Math.min(cards.length-1,i+cols);
    if(key==='ArrowUp')n=i-cols;
    if(n>=0&&n!==i){cards[n]?.focus();return}
    if(key==='ArrowUp'&&i<cols)document.querySelector('.profile.active')?.focus();
    return;
  }
  if(current.classList.contains('profile')){
    const chips=[...document.querySelectorAll('.profile')],i=chips.indexOf(current);
    if(key==='ArrowRight')chips[Math.min(chips.length-1,i+1)]?.focus();
    if(key==='ArrowLeft')chips[Math.max(0,i-1)]?.focus();
    if(key==='ArrowDown')document.querySelector('.card')?.focus();
  }
}

document.addEventListener('keydown',e=>{
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){
    e.preventDefault();moveFocus(e.key);
  }
});

load().catch(err=>{
  console.error(err);
  document.getElementById('content').innerHTML='<div class="error">Не удалось загрузить каталог.<br>'+String(err.message).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))+'</div>';
  setStatus('Ошибка загрузки');
});
</script>
</body>
</html>
