name: Build Lotus Executor APK
on:
  push:
    branches: [lotus-executor-apk-prototype, lotus-executor-owner-ssh-prototype]
    paths:
      - 'lotus-executor/**'
      - '.github/workflows/lotus-executor-apk.yml'
  workflow_dispatch:
concurrency:
  group: lotus-executor-build-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK Platform 34
        run: |
          echo "SDK: $ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-34' 'build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Validate owner-side signing bootstrap syntax
        run: bash -n lotus-executor/bootstrap-stable-signing.sh
      - name: Build debug APK
        working-directory: lotus-executor
        run: gradle --no-daemon :app:assembleDebug
      - name: Reject unsigned release packaging
        working-directory: lotus-executor
        run: |
          set -euo pipefail
          if gradle --no-daemon :app:assembleRelease > /tmp/lotus-executor-unsigned-release.log 2>&1; then
            echo "SECURITY ERROR: unsigned release was accepted"
            exit 1
          fi
          grep -F 'Lotus Executor release requires a persistent authorized signing key' /tmp/lotus-executor-unsigned-release.log
      - name: Verify release signing using throwaway CI-only key
        working-directory: lotus-executor
        run: |
          set -euo pipefail
          umask 077
          export LOTUS_EXECUTOR_KEYSTORE_PATH="$RUNNER_TEMP/executor-ci-only.p12"
          export LOTUS_EXECUTOR_STORE_PASSWORD="only-for-this-disposable-ci-key"
          export LOTUS_EXECUTOR_KEY_PASSWORD="$LOTUS_EXECUTOR_STORE_PASSWORD"
          export LOTUS_EXECUTOR_KEY_ALIAS="ci-test"
          keytool -genkeypair -noprompt -storetype PKCS12 \
            -keystore "$LOTUS_EXECUTOR_KEYSTORE_PATH" \
            -storepass "$LOTUS_EXECUTOR_STORE_PASSWORD" \
            -keypass "$LOTUS_EXECUTOR_KEY_PASSWORD" \
            -alias "$LOTUS_EXECUTOR_KEY_ALIAS" -keyalg RSA -keysize 3072 \
            -validity 1 -dname "CN=DISPOSABLE CI TEST ONLY"
          gradle --no-daemon :app:assembleRelease
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs \
            app/build/outputs/apk/release/app-release.apk > "$RUNNER_TEMP/executor-test-signature.txt"
          grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true' \
            "$RUNNER_TEMP/executor-test-signature.txt"
          rm -f "$LOTUS_EXECUTOR_KEYSTORE_PATH" \
            "$RUNNER_TEMP/executor-test-signature.txt" \
            app/build/outputs/apk/release/app-release.apk
      - name: Compute APK SHA256
        run: sha256sum lotus-executor/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: lotus-executor-debug-apk
          path: lotus-executor/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 3
          if-no-files-found: error
