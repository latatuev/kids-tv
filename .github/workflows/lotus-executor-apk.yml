name: Build Lotus Executor APK
on:
  push:
    branches: [lotus-executor-apk-prototype]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK Platform 34
        run: |
          echo "SDK: $ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-34' 'build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        working-directory: lotus-executor
        run: gradle --no-daemon :app:assembleDebug
      - name: Compute APK SHA256
        run: sha256sum lotus-executor/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: lotus-executor-debug-apk
          path: lotus-executor/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 3
          if-no-files-found: error
