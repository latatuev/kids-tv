name: Build Kids TV APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Android project
        shell: bash
        run: |
          curl -fsSL "https://cmgdmsqcxrbwxghydmtb.supabase.co/functions/v1/kids-tv-android-build" -o /tmp/setup-kidstv.sh
          bash /tmp/setup-kidstv.sh

      - name: Restore release keystore
        shell: bash
        env:
          KIDSTV_KEYSTORE_BASE64: ${{ secrets.KIDSTV_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KIDSTV_KEYSTORE_BASE64" | base64 --decode > kids-tv-release.jks

      - name: Build signed release APK
        env:
          KIDSTV_KEYSTORE_PASSWORD: ${{ secrets.KIDSTV_KEYSTORE_PASSWORD }}
          KIDSTV_KEY_ALIAS: ${{ secrets.KIDSTV_KEY_ALIAS }}
          KIDSTV_KEY_PASSWORD: ${{ secrets.KIDSTV_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kids-tv-v0.8
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
