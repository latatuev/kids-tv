name: Build Kids TV APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Create Android project
        shell: bash
        run: |
          set -e
          mkdir -p app/src/main/java/com/latatuev/kidstv

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "KidsTV"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.latatuev.kidstv'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.latatuev.kidstv'
                  minSdk 23
                  targetSdk 35
                  versionCode 2
                  versionName '0.2'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />

              <queries>
                  <package android:name="com.kinopub" />
              </queries>

              <application
                  android:allowBackup="false"
                  android:label="Kids TV"
                  android:theme="@android:style/Theme.Material.NoActionBar"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="landscape">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/latatuev/kidstv/MainActivity.java <<'EOF'
          package com.latatuev.kidstv;

          import android.app.Activity;
          import android.app.SearchManager;
          import android.content.ComponentName;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.View;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;

          public class MainActivity extends Activity {
              private static final String HOME = "https://latatuev.github.io/kids-tv/";
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_FULLSCREEN |
                      View.SYSTEM_UI_FLAG_HIDE_NAVIGATION |
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                  );

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettingsCompat.configure(webView);

                  webView.addJavascriptInterface(new Bridge(), "KidsTVAndroid");
                  webView.setWebChromeClient(new WebChromeClient());

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          return handleUrl(request.getUrl().toString());
                      }

                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, String url) {
                          return handleUrl(url);
                      }
                  });

                  webView.loadUrl(HOME);
              }

              private boolean handleUrl(String url) {
                  if (url == null || !url.startsWith("intent:")) return false;

                  try {
                      Intent parsed = Intent.parseUri(url, Intent.URI_INTENT_SCHEME);
                      String title = parsed.getStringExtra(SearchManager.QUERY);
                      if (title == null || title.isEmpty()) {
                          title = parsed.getStringExtra("query");
                      }

                      if (title != null && !title.isEmpty()) {
                          openKinoPubSearch(Uri.decode(title));
                      } else {
                          startActivity(parsed);
                      }
                  } catch (Exception e) {
                      Toast.makeText(this, "Не удалось открыть KinoPub", Toast.LENGTH_LONG).show();
                  }
                  return true;
              }

              private void openKinoPubSearch(String title) {
                  try {
                      Intent i = new Intent(Intent.ACTION_SEARCH);
                      i.setComponent(new ComponentName(
                          "com.kinopub",
                          "com.kinopub.activity.InfoActivity"
                      ));
                      i.putExtra(SearchManager.QUERY, title);
                      startActivity(i);
                  } catch (Exception e) {
                      try {
                          Intent launch = getPackageManager().getLaunchIntentForPackage("com.kinopub");
                          if (launch != null) {
                              startActivity(launch);
                              Toast.makeText(
                                  this,
                                  "KinoPub открыт, но поиск передать не удалось",
                                  Toast.LENGTH_LONG
                              ).show();
                          } else {
                              Toast.makeText(this, "KinoPub не установлен", Toast.LENGTH_LONG).show();
                          }
                      } catch (Exception ignored) {
                          Toast.makeText(this, "Не удалось открыть KinoPub", Toast.LENGTH_LONG).show();
                      }
                  }
              }

              public class Bridge {
                  @JavascriptInterface
                  public void search(final String title) {
                      runOnUiThread(() -> openKinoPubSearch(title));
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              private static class WebSettingsCompat {
                  static void configure(WebView webView) {
                      android.webkit.WebSettings s = webView.getSettings();
                      s.setJavaScriptEnabled(true);
                      s.setDomStorageEnabled(true);
                      s.setMediaPlaybackRequiresUserGesture(false);
                  }
              }
          }
          EOF

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kids-tv-apk
          path: app/build/outputs/apk/debug/app-debug.apk
