name: Family Call v0.4 Android APK
on:
  push:
    branches: [family-call-apk-build-20261102]
    paths: ['family-call-v04-source.zip', '.github/workflows/family-call-apk-20261103.yml']
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Expand source
        run: unzip -q family-call-v04-source.zip
      - name: Ensure Android SDK API 34
        run: "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager 'platforms;android-34' 'build-tools;34.0.0'"
      - name: Test and assemble
        working-directory: FamilyCall-v0.4
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Verify APK
        run: |
          test -s FamilyCall-v0.4/app/build/outputs/apk/debug/app-debug.apk
          unzip -t FamilyCall-v0.4/app/build/outputs/apk/debug/app-debug.apk | tail -1
          sha256sum FamilyCall-v0.4/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: family-call-v04-debug-apk
          path: FamilyCall-v0.4/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
